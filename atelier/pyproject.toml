[project]
name = "atelier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maria Cesarotti", email = "mariacesarotti@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
atelier = "atelier:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.workspace]
members = [
    "src/atelier/audio",
    "audio",
]
