[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atelier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pydantic",
    "soundfile",
    "pyloudnorm",
    "typer",
]

[project.scripts]
atelier = "atelier.cli:app"

[dependency-groups]
dev = ["pytest", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/atelier"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["soundfile", "pyloudnorm"]
ignore_missing_imports = true
