<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tailwater: teste de áudio</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    li { display: flex; gap: .75rem; align-items: center; margin: .5rem 0; }
    button { font: inherit; padding: .35rem .8rem; }
    small { color: #666; }
    #log { color: #b00; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Teste de áudio</h1>
  <p><small>Lê o manifest.json gerado pelo atelier e toca cada asset pelo Web Audio.
  Ambiências tocam em loop; sfx tocam uma vez.</small></p>
  <ul id="list"></ul>
  <div id="log"></div>

<script type="module">
  const BASE = import.meta.env?.BASE_URL ?? "/";
  const ROOT = `${BASE}assets/generated/`;
  const ctx = new AudioContext(); // só começa de verdade depois de um clique
  const playing = new Map();      // id -> source em execução
  const log = (msg) => { document.getElementById("log").textContent += msg + "\n"; };

  // Escolhe o primeiro formato que este navegador diz que toca.
  const MIME = { ogg: 'audio/ogg; codecs="vorbis"', m4a: 'audio/mp4; codecs="mp4a.40.2"' };
  const probe = document.createElement("audio");
  const pickFormat = (files) =>
    Object.keys(files).find((f) => probe.canPlayType(MIME[f]) !== "") ?? null;

  const buffers = new Map();
  async function load(asset) {
    if (buffers.has(asset.id)) return buffers.get(asset.id);
    const fmt = pickFormat(asset.files);
    if (!fmt) throw new Error(`nenhum formato tocável em ${Object.keys(asset.files)}`);
    const res = await fetch(ROOT + asset.files[fmt]);
    if (!res.ok) throw new Error(`${res.status} em ${asset.files[fmt]}`);
    const buf = await ctx.decodeAudioData(await res.arrayBuffer());
    const entry = { buf, fmt };
    buffers.set(asset.id, entry);
    return entry;
  }

  function stop(id) {
    playing.get(id)?.stop();
    playing.delete(id);
  }

  async function toggle(asset, button, info) {
    await ctx.resume();
    if (playing.has(asset.id)) { stop(asset.id); button.textContent = "tocar"; return; }
    try {
      const { buf, fmt } = await load(asset);
      const mb = (buf.length * buf.numberOfChannels * 4) / 1e6;
      info.textContent = `${fmt}, ${buf.duration.toFixed(1)} s, ${buf.numberOfChannels} canais, ~${mb.toFixed(1)} MB decodificado`;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop = asset.meta.loop === true;
      src.connect(ctx.destination);
      src.onended = () => { if (playing.get(asset.id) === src) { playing.delete(asset.id); button.textContent = "tocar"; } };
      src.start();
      playing.set(asset.id, src);
      button.textContent = src.loop ? "parar (loop)" : "parar";
    } catch (err) {
      log(`${asset.id}: ${err.message}`);
    }
  }

  try {
    const manifest = await (await fetch(ROOT + "manifest.json", { cache: "no-store" })).json();
    const list = document.getElementById("list");
    for (const asset of manifest.assets) {
      const li = document.createElement("li");
      const button = Object.assign(document.createElement("button"), { textContent: "tocar" });
      const name = Object.assign(document.createElement("strong"), { textContent: asset.id });
      const info = document.createElement("small");
      info.textContent = `${asset.meta.role}, alvo ${asset.meta.loudness_lufs} LUFS`;
      button.addEventListener("click", () => toggle(asset, button, info));
      li.append(button, name, info);
      list.append(li);
    }
  } catch (err) {
    log(`não consegui ler o manifest (${err.message}). Rodou o atelier build?`);
  }
</script>
</body>
</html>
